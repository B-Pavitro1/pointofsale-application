---
- name: Deploy Application Artifact to Target Server
  hosts: app_servers
  become: true
  tasks:
    - name: Ensure target directories exist
      file:
        path: "{{ item }}"
        state: directory
        owner: posapp
        group: posapp
        mode: '0755'
      loop:
        - /opt/pos
        - /opt/pos/frontend

    - name: Deploy frontend presentation files
      copy:
        src: "{{ playbook_dir }}/../../frontend/"
        dest: /opt/pos/frontend/
        owner: posapp
        group: posapp
        mode: '0644'

    - name: Deploy Spring Boot application JAR artifact
      copy:
        src: "{{ jar_source_path | default(playbook_dir + '/../../backend/target/pointofsale-application-1.0.0.jar') }}"
        dest: /opt/pos/app.jar
        owner: posapp
        group: posapp
        mode: '0750'
      notify: Restart pos-app service

    - name: Flush handlers to restart application immediately
      meta: flush_handlers

    - name: Verify application health endpoint (Health check)
      uri:
        url: "http://127.0.0.1:{{ app_port | default('8080') }}/actuator/health"
        method: GET
        status_code: 200
        return_content: yes
      register: health_check
      until: health_check.status == 200 and 'UP' in health_check.content
      retries: 12
      delay: 5

    - name: Log successful deployment
      debug:
        msg: "Point of Sale application deployed and validated successfully! Status: {{ health_check.json.status }}"

  handlers:
    - name: Restart pos-app service
      systemd:
        name: pos-app
        state: restarted
        enabled: yes
